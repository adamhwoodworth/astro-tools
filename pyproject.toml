[project]
name = "moon-dark-nights"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "timezonefinder[numba]>=8.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can `import darknights` regardless of
# whether pytest is launched as `pytest` or `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes (F) + pycodestyle errors (E) + import sorting (I).
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
