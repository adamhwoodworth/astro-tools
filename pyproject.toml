[project]
name = "astro-tools"
version = "0.1.0"
description = "Astrophotography and night sky observation planning tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "timezonefinder[numba]>=8.2.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import the scripts (`import tides`)
# regardless of whether pytest is launched as `pytest` or `python -m pytest`.
# The astro_tools library itself is installed into the venv by uv.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes (F) + pycodestyle errors (E) + import sorting (I).
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
